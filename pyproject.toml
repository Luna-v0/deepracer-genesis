[project]
name = "deepracer-genesis"
version = "0.1.1"
description = "AWS DeepRacer RL environment ported to Genesis (ROS-free, GPU-batched, vision-based, RSL-RL)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 1.2.3 pins quadrants 1.1.1, which fixes the GPU allocator memory-safety
    # bugs behind the sporadic DR CUDA_ERROR_ILLEGAL_ADDRESS + NaN'd physics.
    "genesis-world>=1.2.3",
    "rsl-rl-lib>=5.4.0",
    "torch>=2.5",
    "tensordict>=0.7",
    "tensorboard",
    "pillow",
    "numpy",
    "pyarrow",
    "imageio[ffmpeg]",
]

[project.urls]
Homepage = "https://github.com/Luna-v0/deepracer-genesis"
Repository = "https://github.com/Luna-v0/deepracer-genesis"
Documentation = "https://luna-v0.github.io/deepracer-genesis/"

[project.optional-dependencies]
# camera observations. gs-madrona (batch renderer) and gs-nyx (path tracer) are
# GPU-only and version-coupled to genesis; the lower bounds are the versions
# verified against genesis 1.3.x (nyx needs genesis>=1.3.1, resolved via its own
# pin). Install with e.g.  uv add "deepracer-genesis[vision] @ git+<url>"
vision = ["gs-madrona>=0.0.10"]
nyx = ["gs-nyx>=0.1.4", "gs-nyx-plugin>=0.1.5"]
tracking = ["mlflow"]
hpo = ["optuna"]
# telemetry DataFrames + trajectory plots (analysis/ package; not needed on
# the car or for training itself)
analysis = ["pandas", "matplotlib"]
# ONNX export/verification (workstation-only; the car runtime needs neither).
# Run exports in a genesis-free process: genesis and onnxruntime bundle
# clashing LLVM symbols (see deploy/onnx.py).
export = ["onnx", "onnxruntime"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepracer_genesis*"]

[tool.setuptools.package-data]
deepracer_genesis = ["assets/**/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    # NOTE: the old NVRTC 12.4 pin (+ scripts/fix_madrona_cuda13.sh) was a
    # workaround for gs-madrona 0.0.8 on a CUDA-13 toolkit. gs-madrona >=0.0.10
    # (pulled by the [vision] extra) requires nvidia-cuda-nvrtc-cu12>=12.8 and
    # links its megakernel natively, so the pin is removed — keeping it makes the
    # [vision] extra unsatisfiable (12.4.127 vs >=12.8).
    "catppuccin-jupyterlab>=0.2.5",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-collaboration>=4.4.1",
    "jupyter-mcp-tools>=0.1.6",
    "jupyterlab>=4.6.1",
    "jupyterlab-git>=0.54.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "jupytext>=1.19.4",
    "lckr-jupyterlab-variableinspector>=3.2.4",
    "pycrdt>=0.13.1",
    "python-lsp-server[all]>=1.14.0",
    # telemetry analysis (mirrors the [analysis] extra for local work)
    "pandas>=2.0",
]
# GPU renderers, synced by default for local `uv run` (camera/Nyx experiments)
# so `uv run experiments/foo.py` "just works". These mirror the [vision]/[nyx]
# EXTRAS (which are what a `uv add "deepracer-genesis[vision] @ git+…"` install
# uses); the group is dev-only and never ships in the wheel or the git install.
renderers = ["gs-madrona>=0.0.10", "gs-nyx>=0.1.4", "gs-nyx-plugin>=0.1.5"]

[tool.uv]
default-groups = ["dev", "renderers"]
